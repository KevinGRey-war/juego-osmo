<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión - Juegos educativos OSMO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fuentes y Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/page-backgrounds.css?v=3">
  <link rel="stylesheet" href="css/login.css?v=2">
</head>
<body data-page-bg="general" class="login-page">
  <main class="login-shell">
    <section class="login-showcase" aria-labelledby="showcaseTitle">
      <div class="login-illustration">
        <img
          src="assets/login-all-games-v1.png"
          alt="Escena educativa con juegos de letras, números, animales, colores, formas, manos, cuerpo humano y dibujo"
        >
      </div>
      <div class="showcase-copy">
        <span class="showcase-brand">Juegos educativos OSMO</span>
        <h1 id="showcaseTitle">Todo un mundo para aprender jugando</h1>
        <p>Explora, descubre y supera nuevos retos en cada actividad.</p>
      </div>
    </section>

    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="login-panel-inner">
        <a class="login-brand" href="index.html" aria-label="Ir al inicio">
          <span class="login-brand-mark" aria-hidden="true">OS</span>
          <span>Juegos OSMO</span>
        </a>

        <header class="login-heading">
          <span>Bienvenido</span>
          <h2 id="loginTitle">Iniciar sesión</h2>
          <p>Ingresa a tu cuenta para continuar aprendiendo.</p>
        </header>

      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-input" autocomplete="email" required>
        </div>
        
        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
          <a class="forgot-link" href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>
        
        <button type="submit" class="btn btn-primary" id="loginSubmit"><span>Ingresar</span></button>
        
        <div id="mensajeLogin" class="message" role="status" aria-live="polite"></div>
        
        <p class="register-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </form>
      </div>
    </section>
  </main>

  <script type="module">
    import { iniciarSesion } from './js/auth.js';

    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const loginSubmit = document.getElementById('loginSubmit');

    passwordToggle?.addEventListener('click', () => {
      const shouldShow = passwordInput.type === 'password';
      passwordInput.type = shouldShow ? 'text' : 'password';
      passwordToggle.textContent = shouldShow ? 'Ocultar' : 'Mostrar';
      passwordToggle.setAttribute('aria-pressed', String(shouldShow));
      passwordInput.focus();
    });
    
    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginSubmit.disabled = true;
      loginSubmit.querySelector('span').textContent = 'Ingresando...';

      try {
        await iniciarSesion();
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.querySelector('span').textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
