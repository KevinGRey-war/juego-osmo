<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR de animales - Zoológico mágico</title>
    <style>
        :root {
            --ink: #173127;
            --forest: #155f3d;
            --canvas: #f3f7f4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .sheet-header {
            color: white;
            background: var(--forest);
        }

        .toolbar {
            width: min(1160px, calc(100% - 32px));
            min-height: 82px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.85rem;
            letter-spacing: 0;
        }

        .title-block p {
            margin: 3px 0 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.88rem;
        }

        .actions { display: flex; gap: 9px; }

        .action {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.48);
            border-radius: 6px;
            color: white;
            background: rgba(255, 255, 255, 0.14);
            font: inherit;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
        }

        main {
            width: min(1160px, calc(100% - 32px));
            margin: 22px auto 44px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .animal-card {
            --accent: #2d8a52;
            --tint: #e7f4ea;
            min-height: 220px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 174px;
            grid-template-rows: 1fr auto;
            gap: 12px 18px;
            padding: 20px;
            border: 2px solid var(--accent);
            border-top-width: 8px;
            border-radius: 8px;
            background: var(--tint);
            break-inside: avoid;
        }

        .animal-info {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .animal-icon {
            flex: 0 0 104px;
            width: 104px;
            height: 104px;
            display: grid;
            place-items: center;
            border: 4px solid white;
            border-radius: 50%;
            background: white;
            font-size: 4.3rem;
            line-height: 1;
        }

        .animal-name {
            min-width: 0;
        }

        .animal-name h2 {
            margin: 0;
            color: var(--accent);
            font-size: 1.65rem;
            letter-spacing: 0;
        }

        .animal-name p {
            margin: 5px 0 0;
            color: #5e7067;
            font-size: 0.78rem;
            overflow-wrap: anywhere;
        }

        .qr-box {
            grid-column: 2;
            grid-row: 1 / 3;
            width: 174px;
            height: 174px;
            align-self: center;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: white;
        }

        .qr-box img,
        .qr-box canvas {
            width: 158px !important;
            height: 158px !important;
            display: block;
        }

        .scan-label {
            align-self: end;
            margin: 0;
            color: #5e7067;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .load-error {
            grid-column: 1 / -1;
            padding: 24px;
            border: 2px solid #c64339;
            color: #8a2d25;
            background: #fff0ee;
            text-align: center;
        }

        @media (max-width: 760px) {
            .toolbar {
                padding: 15px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .actions { width: 100%; }
            .action { flex: 1; }
            .qr-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .animal-card {
                min-height: 180px;
                grid-template-columns: minmax(0, 1fr) 126px;
                padding: 14px;
                gap: 8px;
            }

            .animal-info { gap: 9px; }
            .animal-icon { flex-basis: 68px; width: 68px; height: 68px; font-size: 2.8rem; }
            .animal-name h2 { font-size: 1.2rem; }
            .qr-box { width: 126px; height: 126px; }
            .qr-box img,
            .qr-box canvas { width: 116px !important; height: 116px !important; }
        }

        @media print {
            @page { size: Letter; margin: 8mm; }
            body { background: white; }
            .sheet-header { print-color-adjust: exact; }
            .toolbar { width: 100%; min-height: 16mm; padding: 0 4mm; }
            h1 { font-size: 16pt; }
            .title-block p { font-size: 8pt; }
            .actions { display: none; }
            main { width: 100%; margin: 4mm 0 0; }
            .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 2.5mm; }
            .animal-card {
                min-height: 43mm;
                grid-template-columns: 1fr 34mm;
                padding: 3.5mm;
                gap: 2mm;
                print-color-adjust: exact;
            }
            .animal-info { gap: 2mm; }
            .animal-icon { flex-basis: 20mm; width: 20mm; height: 20mm; border-width: 1mm; font-size: 13mm; }
            .animal-name h2 { font-size: 11pt; }
            .animal-name p,
            .scan-label { font-size: 5.5pt; }
            .qr-box { width: 34mm; height: 34mm; }
            .qr-box img,
            .qr-box canvas { width: 32mm !important; height: 32mm !important; }
        }
    </style>
  <link rel="stylesheet" href="css/page-backgrounds.css?v=3">
</head>
<body data-page-bg="zoo">
    <header class="sheet-header">
        <div class="toolbar">
            <div class="title-block">
                <h1>ANIMALES QR</h1>
                <p>Zoológico mágico - Observa, escanea y descubre</p>
            </div>
            <div class="actions">
                <button class="action" type="button" id="backBtn">← Juego</button>
                <a class="action" href="output/pdf/animales-qr.pdf?v=1" download="animales-qr.pdf">↓ PDF</a>
                <button class="action" type="button" id="printBtn">▣ Imprimir</button>
            </div>
        </div>
    </header>
    <main>
        <section id="qrGrid" class="qr-grid" aria-label="Códigos QR de animales"></section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const animals = [
            ['ANIMAL-LEON', 'León', '🦁'],
            ['ANIMAL-ELEFANTE', 'Elefante', '🐘'],
            ['ANIMAL-JIRAFA', 'Jirafa', '🦒'],
            ['ANIMAL-MONO', 'Mono', '🐒'],
            ['ANIMAL-TIGRE', 'Tigre', '🐯'],
            ['ANIMAL-CEBRA', 'Cebra', '🦓'],
            ['ANIMAL-OSO', 'Oso', '🐻'],
            ['ANIMAL-PINGUINO', 'Pingüino', '🐧'],
            ['ANIMAL-PANDA', 'Panda', '🐼'],
            ['ANIMAL-COCODRILO', 'Cocodrilo', '🐊']
        ];
        const palettes = [
            ['#2d8a52', '#e7f4ea'], ['#ed6a4a', '#fff0eb'],
            ['#168b98', '#e6f5f6'], ['#b77900', '#fff7dc'],
            ['#c64339', '#fff0ee'], ['#6a56a8', '#f1edfb'],
            ['#345ca8', '#eaf0fc'], ['#d23879', '#fcebf3'],
            ['#41743a', '#edf6e9'], ['#9a5b21', '#faefe4']
        ];
        const grid = document.getElementById('qrGrid');

        if (typeof QRCode === 'undefined') {
            grid.innerHTML = '<p class="load-error">No se pudieron cargar los QR. Comprueba la conexión y recarga la página.</p>';
        } else {
            animals.forEach(([code, name, emoji], index) => {
                const card = document.createElement('article');
                card.className = 'animal-card';
                card.style.setProperty('--accent', palettes[index][0]);
                card.style.setProperty('--tint', palettes[index][1]);
                card.innerHTML = `
                    <div class="animal-info">
                        <div class="animal-icon" aria-hidden="true">${emoji}</div>
                        <div class="animal-name"><h2>${name}</h2><p>${code}</p></div>
                    </div>
                    <p class="scan-label">Escanea para descubrir al ${name.toLowerCase()}</p>
                    <div class="qr-box" aria-label="Código QR de ${name}"></div>
                `;
                grid.appendChild(card);
                new QRCode(card.querySelector('.qr-box'), {
                    text: code,
                    width: 158,
                    height: 158,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            const gameUrl = 'zoologico.html?v=15';
            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                window.close();
                return;
            }
            window.location.replace(gameUrl);
        });
        document.getElementById('printBtn').addEventListener('click', () => window.print());
    </script>
</body>
</html>
