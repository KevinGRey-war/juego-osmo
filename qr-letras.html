<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Códigos QR de las letras</title>
    <style>
        :root {
            --ink: #243447;
            --green: #174c2a;
            --paper: #ffffff;
            --surface: #eef3f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        header {
            background: var(--green);
            color: white;
        }

        .toolbar {
            width: min(1120px, calc(100% - 32px));
            min-height: 86px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.55rem, 4vw, 2rem);
            letter-spacing: 0;
        }

        .brand p {
            margin: 4px 0 0;
            color: rgba(255,255,255,0.82);
            font-size: 0.92rem;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.48);
            border-radius: 6px;
            color: white;
            background: rgba(255,255,255,0.16);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .action:hover,
        .action:focus-visible { background: rgba(255,255,255,0.28); }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 24px auto 48px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .qr-card {
            --accent: #238636;
            --tint: #e9f8ed;
            min-height: 220px;
            display: grid;
            grid-template-columns: minmax(92px, 1fr) 82px 176px;
            grid-template-rows: 1fr auto auto;
            column-gap: 12px;
            padding: 24px 18px 18px;
            background: var(--tint);
            border: 2px solid var(--accent);
            border-top-width: 8px;
            border-radius: 8px;
            break-inside: avoid;
        }

        .card-title {
            grid-column: 1;
            grid-row: 2;
            margin: 0;
            color: #596a61;
            font-size: 0.92rem;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: 0;
        }

        .letter-shape {
            grid-column: 1;
            grid-row: 1;
            align-self: center;
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--ink);
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .letter-shape .upper { color: var(--accent); }

        .reference-object {
            grid-column: 2;
            grid-row: 1 / 4;
            align-self: center;
            justify-self: center;
            width: 82px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .object-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border: 2px solid color-mix(in srgb, var(--accent) 26%, white);
            border-radius: 50%;
            background: white;
            font-size: 2.7rem;
            line-height: 1;
        }

        .object-name {
            width: 100%;
            margin-top: 6px;
            overflow-wrap: anywhere;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
        }

        .qr-caption {
            grid-column: 1;
            grid-row: 3;
            margin: 5px 0 0;
            color: #65756d;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .qr-code {
            grid-column: 3;
            grid-row: 1 / 4;
            align-self: center;
            justify-self: end;
            width: 176px;
            height: 176px;
            display: grid;
            place-items: center;
            background: white;
            border-radius: 7px;
        }

        .qr-code img,
        .qr-code canvas {
            display: block;
            width: 160px !important;
            height: 160px !important;
        }

        .load-error {
            grid-column: 1 / -1;
            padding: 24px;
            border: 2px solid #c0392b;
            background: #fff5f4;
            color: #922b21;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .toolbar {
                padding: 18px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .actions { width: 100%; }
            .action { flex: 1; }
            .qr-grid { grid-template-columns: 1fr; }
            .qr-card {
                min-height: 190px;
                grid-template-columns: minmax(68px, 1fr) 60px 132px;
                column-gap: 8px;
                padding: 18px 10px 12px;
            }
            .letter-shape { gap: 8px; font-size: 2.35rem; }
            .reference-object { width: 60px; }
            .object-icon { width: 52px; height: 52px; font-size: 2.1rem; }
            .object-name { margin-top: 4px; font-size: 0.6rem; }
            .qr-code,
            .qr-code img,
            .qr-code canvas { width: 126px !important; height: 126px !important; }
            .qr-code { width: 132px; height: 132px; }
        }

        @media print {
            @page { size: Letter; margin: 8mm; }
            body { background: white; }
            header { background: var(--green); print-color-adjust: exact; }
            .toolbar { width: 100%; min-height: 16mm; padding: 0 4mm; }
            .brand h1 { font-size: 16pt; }
            .brand p { font-size: 8pt; }
            .actions { display: none; }
            main { width: 100%; margin: 4mm 0 0; }
            .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 3mm; }
            .qr-card {
                min-height: 45mm;
                grid-template-columns: 1fr 20mm 35mm;
                padding: 4mm;
                column-gap: 4mm;
                print-color-adjust: exact;
            }
            .letter-shape { font-size: 12mm; }
            .reference-object { width: 20mm; }
            .object-icon { width: 16mm; height: 16mm; font-size: 10mm; }
            .object-name { margin-top: 1mm; font-size: 5.5pt; }
            .qr-code,
            .qr-code img,
            .qr-code canvas { width: 35mm !important; height: 35mm !important; }
            .card-title { font-size: 7pt; }
            .qr-caption { font-size: 6pt; }
        }
    </style>
  <link rel="stylesheet" href="css/page-backgrounds.css?v=3">
</head>
<body data-page-bg="letters">
    <header>
        <div class="toolbar">
            <div class="brand">
                <h1>ABECEDARIO QR</h1>
                <p>May&uacute;sculas y min&uacute;sculas - A a Z</p>
            </div>
            <div class="actions">
                <button class="action" type="button" id="backBtn">&larr; Juego</button>
                <button class="action" type="button" id="printBtn">Imprimir</button>
            </div>
        </div>
    </header>

    <main>
        <section class="qr-grid" id="qrGrid" aria-label="Códigos QR de las letras"></section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const grid = document.getElementById('qrGrid');

        if (typeof QRCode === 'undefined') {
            grid.innerHTML = '<p class="load-error">No se pudieron cargar los c\u00f3digos QR. Comprueba la conexi\u00f3n a internet y recarga la p\u00e1gina.</p>';
        } else {
            const palettes = [
                ['#238636', '#e9f8ed'], ['#e76f00', '#fff0e1'],
                ['#147dab', '#e7f5fc'], ['#c93a46', '#fdebed'],
                ['#7b3fa1', '#f5ecfa'], ['#b77900', '#fff7d8'],
                ['#00877a', '#e3f8f5'], ['#d63384', '#fceaf4'],
                ['#3455a4', '#ebf0fc'], ['#6c7d00', '#f4f8dd'],
                ['#d85216', '#fff0e9'], ['#526d82', '#edf3f6'],
                ['#8b4513', '#f9eee7']
            ];
            const objects = [
                ['\u{1F333}', '\u00c1rbol'], ['\u26BD', 'Bal\u00f3n'],
                ['\u{1F3E0}', 'Casa'], ['\u{1F3B2}', 'Dado'],
                ['\u2B50', 'Estrella'], ['\u{1F33B}', 'Flor'],
                ['\u{1F431}', 'Gato'], ['\u{1F366}', 'Helado'],
                ['\u{1F3DD}\uFE0F', 'Isla'], ['\u{1F9C3}', 'Jugo'],
                ['\u{1F95D}', 'Kiwi'], ['\u{1F319}', 'Luna'],
                ['\u{1F34E}', 'Manzana'], ['\u2601\uFE0F', 'Nube'],
                ['\u{1F43B}', 'Oso'], ['\u{1F41F}', 'Pez'],
                ['\u{1F9C0}', 'Queso'], ['\u23F0', 'Reloj'],
                ['\u2600\uFE0F', 'Sol'], ['\u{1F682}', 'Tren'],
                ['\u{1F347}', 'Uvas'], ['\u{1F56F}\uFE0F', 'Vela'],
                ['\u{1F9C7}', 'Waffle'], ['\u{1F3B9}', 'Xil\u00f3fono'],
                ['\u{1FA80}', 'Yo-yo'], ['\u{1F45F}', 'Zapato']
            ];

            Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ').forEach((letterValue, index) => {
                const card = document.createElement('article');
                card.className = 'qr-card';
                card.style.setProperty('--accent', palettes[index % palettes.length][0]);
                card.style.setProperty('--tint', palettes[index % palettes.length][1]);

                const title = document.createElement('h2');
                title.className = 'card-title';
                title.textContent = `Letra ${letterValue} ${letterValue.toLowerCase()}`;

                const letter = document.createElement('div');
                letter.className = 'letter-shape';
                const upper = document.createElement('span');
                upper.className = 'upper';
                upper.textContent = letterValue;
                const lower = document.createElement('span');
                lower.textContent = letterValue.toLowerCase();
                letter.append(upper, lower);
                letter.setAttribute('aria-hidden', 'true');

                const caption = document.createElement('p');
                caption.className = 'qr-caption';
                caption.textContent = `El QR contiene: ${letterValue}`;

                const reference = document.createElement('div');
                reference.className = 'reference-object';
                reference.setAttribute('role', 'img');
                reference.setAttribute('aria-label', objects[index][1]);
                const objectIcon = document.createElement('span');
                objectIcon.className = 'object-icon';
                objectIcon.textContent = objects[index][0];
                objectIcon.setAttribute('aria-hidden', 'true');
                const objectName = document.createElement('span');
                objectName.className = 'object-name';
                objectName.textContent = objects[index][1];
                reference.append(objectIcon, objectName);

                const qr = document.createElement('div');
                qr.className = 'qr-code';
                qr.setAttribute('aria-label', `C\u00f3digo QR de la letra ${letterValue}`);

                card.append(letter, title, caption, reference, qr);
                grid.appendChild(card);

                new QRCode(qr, {
                    text: letterValue,
                    width: 160,
                    height: 160,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            const gameUrl = 'juegoletras.html?v=17';

            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                window.close();
                return;
            }

            window.location.replace(gameUrl);
        });

        document.getElementById('printBtn').addEventListener('click', () => window.print());
    </script>
</body>
</html>
