<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&oacute;digos QR de los n&uacute;meros</title>
    <style>
        :root {
            --ink: #243447;
            --green: #174c2a;
            --paper: #ffffff;
            --surface: #eef3f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background: var(--surface);
        }

        header {
            background: var(--green);
            color: white;
        }

        .toolbar {
            width: min(1280px, calc(100% - 32px));
            min-height: 86px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.55rem, 4vw, 2rem);
            letter-spacing: 0;
        }

        .brand p {
            margin: 4px 0 0;
            color: rgba(255,255,255,0.82);
            font-size: 0.92rem;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.48);
            border-radius: 6px;
            color: white;
            background: rgba(255,255,255,0.16);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .action:hover,
        .action:focus-visible { background: rgba(255,255,255,0.28); }

        main {
            width: min(1280px, calc(100% - 32px));
            margin: 24px auto 48px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .qr-card {
            --accent: #238636;
            --tint: #e9f8ed;
            min-height: 250px;
            display: grid;
            grid-template-columns: minmax(78px, 1fr) 138px 184px;
            grid-template-rows: 1fr auto auto;
            column-gap: 16px;
            padding: 26px 20px 20px;
            background: var(--tint);
            border: 2px solid var(--accent);
            border-top-width: 8px;
            border-radius: 8px;
            break-inside: avoid;
        }

        .card-title {
            grid-column: 1;
            grid-row: 2;
            margin: 0;
            color: #596a61;
            font-size: 0.92rem;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: 0;
        }

        .number-shape {
            grid-column: 1;
            grid-row: 1;
            align-self: center;
            color: var(--accent);
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            text-align: center;
        }

        .reference-object {
            grid-column: 2;
            grid-row: 1 / 4;
            align-self: center;
            justify-self: center;
            width: 138px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .object-group {
            width: 134px;
            min-height: 104px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 2px solid color-mix(in srgb, var(--accent) 26%, white);
            border-radius: 8px;
            background: white;
            overflow: hidden;
        }

        .object-icon {
            min-width: 0;
            display: grid;
            place-items: center;
            line-height: 1;
            text-align: center;
        }

        .object-group.single .object-icon { font-size: 3.25rem; }

        .object-group.spacious .object-icon {
            flex: 0 0 calc(50% - 3px);
            font-size: 1.85rem;
        }

        .object-group.compact .object-icon {
            flex: 0 0 calc(20% - 4px);
            font-size: 1.2rem;
        }

        .object-name {
            width: 100%;
            margin-top: 8px;
            overflow-wrap: anywhere;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
        }

        .qr-caption {
            grid-column: 1;
            grid-row: 3;
            margin: 5px 0 0;
            color: #65756d;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .qr-code {
            grid-column: 3;
            grid-row: 1 / 4;
            align-self: center;
            justify-self: end;
            width: 176px;
            height: 176px;
            display: grid;
            place-items: center;
            background: white;
            border-radius: 7px;
        }

        .qr-code img,
        .qr-code canvas {
            display: block;
            width: 160px !important;
            height: 160px !important;
        }

        .load-error {
            grid-column: 1 / -1;
            padding: 24px;
            border: 2px solid #c0392b;
            background: #fff5f4;
            color: #922b21;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 1000px) {
            .qr-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .toolbar {
                padding: 18px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .actions { width: 100%; }
            .action { flex: 1; }
            .qr-card {
                min-height: 210px;
                grid-template-columns: minmax(48px, 1fr) 100px 124px;
                column-gap: 6px;
                padding: 18px 10px 14px;
            }
            .number-shape { font-size: 2.7rem; }
            .reference-object { width: 100px; }
            .object-group { width: 96px; min-height: 82px; padding: 6px; gap: 3px; }
            .object-group.single .object-icon { font-size: 2.5rem; }
            .object-group.spacious .object-icon { flex-basis: calc(50% - 2px); font-size: 1.45rem; }
            .object-group.compact .object-icon { flex-basis: calc(20% - 3px); font-size: 0.9rem; }
            .object-name { margin-top: 4px; font-size: 0.6rem; }
            .qr-code { width: 124px; height: 124px; }
            .qr-code img,
            .qr-code canvas { width: 116px !important; height: 116px !important; }
        }

        @media print {
            @page { size: Letter; margin: 8mm; }
            body { background: white; }
            header { background: var(--green); print-color-adjust: exact; }
            .toolbar { width: 100%; min-height: 16mm; padding: 0 4mm; }
            .brand h1 { font-size: 16pt; }
            .brand p { font-size: 8pt; }
            .actions { display: none; }
            main { width: 100%; margin: 4mm 0 0; }
            .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 2.5mm; }
            .qr-card {
                min-height: 45mm;
                grid-template-columns: 1fr 27mm 35mm;
                padding: 4mm;
                column-gap: 2mm;
                print-color-adjust: exact;
            }
            .number-shape { font-size: 14mm; }
            .reference-object { width: 27mm; }
            .object-group { width: 26mm; min-height: 22mm; padding: 1.5mm; gap: 1mm; }
            .object-group.spacious .object-icon { flex-basis: calc(50% - 0.5mm); font-size: 11pt; }
            .object-group.compact .object-icon { flex-basis: calc(20% - 0.8mm); font-size: 7.5pt; }
            .object-group.single .object-icon { font-size: 12mm; }
            .object-name { margin-top: 1mm; font-size: 5.5pt; }
            .qr-code,
            .qr-code img,
            .qr-code canvas { width: 35mm !important; height: 35mm !important; }
            .card-title { font-size: 7pt; }
            .qr-caption { font-size: 6pt; }
        }
    </style>
  <link rel="stylesheet" href="css/page-backgrounds.css?v=3">
</head>
<body data-page-bg="numbers">
    <header>
        <div class="toolbar">
            <div class="brand">
                <h1>N&Uacute;MEROS QR</h1>
                <p>Del 1 al 10 - Cuenta, observa y escanea</p>
            </div>
            <div class="actions">
                <button class="action" type="button" id="backBtn">&larr; Juego</button>
                <button class="action" type="button" id="printBtn">Imprimir</button>
            </div>
        </div>
    </header>

    <main>
        <section class="qr-grid" id="qrGrid" aria-label="C&oacute;digos QR de los n&uacute;meros"></section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const grid = document.getElementById('qrGrid');
        const palettes = [
            ['#238636', '#e9f8ed'], ['#e76f00', '#fff0e1'],
            ['#147dab', '#e7f5fc'], ['#c93a46', '#fdebed'],
            ['#7b3fa1', '#f5ecfa'], ['#b77900', '#fff7d8'],
            ['#00877a', '#e3f8f5'], ['#d63384', '#fceaf4'],
            ['#3455a4', '#ebf0fc'], ['#6c7d00', '#f4f8dd']
        ];
        const objects = [
            ['\u2600\uFE0F', 'Sol'], ['\u{1F441}\uFE0F', 'Ojos'],
            ['\u{1F388}', 'Globos'], ['\u{1F343}', 'Hojas'],
            ['\u2B50', 'Estrellas'], ['\u{1F41F}', 'Peces'],
            ['\u{1F33C}', 'Flores'], ['\u270F\uFE0F', 'L\u00e1pices'],
            ['\u{1F34E}', 'Manzanas'], ['\u26BD', 'Balones']
        ];

        if (typeof QRCode === 'undefined') {
            grid.innerHTML = '<p class="load-error">No se pudieron cargar los c\u00f3digos QR. Comprueba la conexi\u00f3n a internet y recarga la p\u00e1gina.</p>';
        } else {
            objects.forEach(([symbol, objectName], index) => {
                const number = index + 1;
                const card = document.createElement('article');
                card.className = 'qr-card';
                card.style.setProperty('--accent', palettes[index][0]);
                card.style.setProperty('--tint', palettes[index][1]);

                const title = document.createElement('h2');
                title.className = 'card-title';
                title.textContent = `N\u00famero ${number}`;

                const numberShape = document.createElement('div');
                numberShape.className = 'number-shape';
                numberShape.textContent = number;
                numberShape.setAttribute('aria-hidden', 'true');

                const caption = document.createElement('p');
                caption.className = 'qr-caption';
                caption.textContent = `El QR contiene: ${number}`;

                const reference = document.createElement('div');
                reference.className = 'reference-object';
                reference.setAttribute('role', 'img');
                reference.setAttribute('aria-label', `${number} ${objectName.toLowerCase()}`);

                const objectGroup = document.createElement('div');
                const densityClass = number === 1 ? 'single' : number <= 4 ? 'spacious' : 'compact';
                objectGroup.className = `object-group ${densityClass}`;
                for (let count = 0; count < number; count += 1) {
                    const icon = document.createElement('span');
                    icon.className = 'object-icon';
                    icon.textContent = symbol;
                    icon.setAttribute('aria-hidden', 'true');
                    objectGroup.appendChild(icon);
                }

                const objectLabel = document.createElement('span');
                objectLabel.className = 'object-name';
                objectLabel.textContent = objectName;
                reference.append(objectGroup, objectLabel);

                const qr = document.createElement('div');
                qr.className = 'qr-code';
                qr.setAttribute('aria-label', `C\u00f3digo QR del n\u00famero ${number}`);

                card.append(numberShape, title, caption, reference, qr);
                grid.appendChild(card);

                new QRCode(qr, {
                    text: String(number),
                    width: 160,
                    height: 160,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            const gameUrl = 'juegonumeros2.html?v=7';

            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                window.close();
                return;
            }

            window.location.replace(gameUrl);
        });

        document.getElementById('printBtn').addEventListener('click', () => window.print());
    </script>
</body>
</html>
